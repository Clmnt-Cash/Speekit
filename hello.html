<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Speekit</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333;
      width: 300px;
      text-align: center;
    }

    header {
      background: white;
      border-bottom: 1px solid #ffffff;
      padding: 12px;
    }

    header img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    main {
      padding: 16px;
    }

    button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      background: rgb(4, 118, 255);
      color: white;
    }

    button:hover {
      background: rgb(2, 101, 223);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Bouton stop spécifique */
    #stopBtn {
      background: rgb(0, 79, 175);
    }

    #stopBtn:hover {
      background: rgb(0, 60, 133);
    }

    /* Settings */
    .settings {
      margin-top: 16px;
      text-align: left;
      border-top: 1px solid #ccc;
      padding-top: 12px;
    }
    .settings h3 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #arrow {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-left: 2px solid #333;
      border-bottom: 2px solid #333;
      transform: rotate(-45deg);
      transition: transform 0.3s ease;
    }

    .settings-content:not(.collapsed) + #arrow {
      transform: rotate(135deg);
    }

    .settings-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .settings-content:not(.collapsed) {
      max-height: 500px;
    }

    .option-section {
      text-align: center;
      margin-bottom: 16px;
    }

    .option-label {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .option-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: border 0.15s ease, background 0.15s ease;
      font-size: 14px;
      font-weight: 600;
      background: #f5f5f5;
      width: 70px;
    }

    .option img {
      width: 30px;
      height: 30px;
      margin-bottom: 6px;
      border-radius: 6px;
    }

    .option:hover {
      background: #e0e0e0;
    }

    .option.selected {
      border-color: #0476ff;
      background: #e6f0ff;
    }

    /* Spoken text styles */
    .spoken-text {
      margin: 12px 0;
      padding: 12px;
      background: rgba(4, 118, 255, 0.05);
      border-radius: 10px;
      text-align: left;
      border: 1px solid rgba(4, 118, 255, 0.1);
      transition: all 0.3s ease;
      min-height: 24px;
    }

    #transcriptionText {
      margin: 0;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.4;
      color: #2c2c2c;
      font-weight: 500;
    }

    /* Remove the empty state message from transcription text */

    /* Animation container */
    .animation-container {
      height: 40px;
      margin: 8px 0;
      position: relative;
    }

    .animation-container::before {
      content: "Let's speak";
      position: absolute;
      top: 40%;
      right: 36%;
      transform: translateY(-50%);
      color: #666;
      font-style: italic;
      font-weight: 800;
      font-size: 150%;
      opacity: 1;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .animation-container::after {
      content: "it!";
      position: absolute;
      top: 40%;
      left: 66%;
      transform: translateY(-50%);
      color: rgb(4, 118, 255);
      font-style: italic;
      font-weight: 800;
      font-size: 150%;
      opacity: 1;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .animation-container:has(.wave-container.speaking)::before,
    .animation-container:has(.processing-indicator.active)::before,
    .animation-container:has(.wave-container.speaking)::after,
    .animation-container:has(.processing-indicator.active)::after {
      opacity: 0;
    }

    /* Wave animation */
    .wave-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .wave-container.speaking {
      opacity: 1;
    }

    .wave-bars {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
    }

    .wave-bars .bar {
      width: 25px;
      height: 25px;
      background: rgb(4, 118, 255);
      border-radius: 4px;
      animation: sound-wave 1s ease-in-out infinite;
      transform-origin: center;
    }

    .wave-bars .bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bars .bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bars .bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bars .bar:nth-child(4) { animation-delay: 0.4s; }
    .wave-bars .bar:nth-child(5) { animation-delay: 0.5s; }

    @keyframes sound-wave {
      0%, 100% { height: 4px; }
      50% { height: 24px; }
    }

    /* Processing indicator */
    .processing-indicator {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .processing-indicator.active {
      opacity: 1;
    }

    .processing-indicator .dot {
      width: 25px;
      height: 25px;
      background: rgb(4, 118, 255);
      border-radius: 50%;
      animation: processing 1.4s infinite ease-in-out;
    }

    .processing-indicator .dot:nth-child(1) { animation-delay: 0s; }
    .processing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .processing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes processing {
      0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
      40% { transform: scale(1.0); opacity: 1; }
    }

  </style>
</head>
<body>
  <header>
    <img src="icons/banner.png" alt="Speekit">
  </header>

  <main>
    <!-- Animation container -->
    <div class="animation-container">
      <!-- Wave animation -->
      <div id="waveContainer" class="wave-container">
        <div class="wave-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <!-- Processing indicator -->
      <div id="processingIndicator" class="processing-indicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Text display -->
    <div id="spokenText" class="spoken-text">
      <p id="transcriptionText"></p>
    </div>

    <!-- Bouton pour démarrer ou arrêter l'enregistrement -->
    <button id="micBtn">🎤 Speak</button>
    <button id="stopBtn">⏹ Stop</button>

    <!-- Settings -->
    <div class="settings">
      <h3 id="settingsToggle">⚙️ Settings <span id="arrow"></span></h3>
      <div class="settings-content collapsed">
        <div class="option-section">
          <p class="option-label">Voix :</p>
          <div id="voiceOptions" class="option-group"></div>
        </div>

        <div class="option-section">
          <p class="option-label">Style :</p>
          <div id="styleOptions" class="option-group"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
